<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motor Monitoring Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1>Motor Monitoring Dashboard</h1>
      <div class="summary-grid">
        <div class="card">
          <span>Online</span>
          <strong id="online-count">0</strong>
        </div>
        <div class="card">
          <span>Offline</span>
          <strong id="offline-count">0</strong>
        </div>
        <div class="card">
          <span>Warnungen</span>
          <strong id="warning-count">0</strong>
        </div>
        <div class="card">
          <span>Gesamt</span>
          <strong id="max-count">0</strong>
        </div>
      </div>
    </header>

    <main>
      <table>
        <thead>
          <tr>
            <th>Motor ID</th>
            <th>Status</th>
            <th>Position (mm)</th>
            <th>Geschwindigkeit (mm/s)</th>
            <th>RAM (%)</th>
            <th>CPU (°C)</th>
            <th>Fehler</th>
            <th>Letztes Update (s)</th>
          </tr>
        </thead>
        <tbody id="motor-table-body"></tbody>
      </table>
    </main>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
